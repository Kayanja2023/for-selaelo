<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#EFE7DA" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9A86" />
      <stop offset="100%" stop-color="#647560" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5C1D24" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Botanical stem & muted sage leaves -->
  <path d="M120 225 C118 185, 122 150, 120 115" stroke="#647560" stroke-width="2.5" stroke-linecap="round" />
  <path d="M119 190 C90 182, 68 160, 58 135 C82 142, 106 160, 119 182 Z" fill="url(#leafGrad)" opacity="0.85" />
  <path d="M121 175 C150 165, 174 146, 184 120 C158 130, 134 148, 121 168 Z" fill="url(#leafGrad)" opacity="0.8" />

  <!-- White Lily Petals -->
  <g filter="url(#softShadow)">
    <!-- Back Left Petal -->
    <path d="M120 118 C92 105, 65 76, 62 42 C92 48, 112 76, 120 118 Z" fill="url(#petalGrad)" stroke="#D4AF37" stroke-width="0.9" stroke-opacity="0.45" />
    <!-- Back Right Petal -->
    <path d="M120 118 C148 105, 175 76, 178 42 C148 48, 128 76, 120 118 Z" fill="url(#petalGrad)" stroke="#D4AF37" stroke-width="0.9" stroke-opacity="0.45" />
    <!-- Center Tall Petal -->
    <path d="M120 122 C102 84, 102 44, 120 18 C138 44, 138 84, 120 122 Z" fill="url(#petalGrad)" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.55" />
    <!-- Front Left Sweeping Petal -->
    <path d="M120 120 C84 124, 52 110, 38 86 C68 80, 98 92, 120 120 Z" fill="url(#petalGrad)" stroke="#C89B98" stroke-width="0.9" stroke-opacity="0.45" />
    <!-- Front Right Sweeping Petal -->
    <path d="M120 120 C156 124, 188 110, 202 86 C172 80, 142 92, 120 120 Z" fill="url(#petalGrad)" stroke="#C89B98" stroke-width="0.9" stroke-opacity="0.45" />
    <!-- Lower Forefront Petal -->
    <path d="M120 118 C104 138, 106 162, 120 176 C134 162, 136 138, 120 118 Z" fill="url(#petalGrad)" stroke="#D4AF37" stroke-width="0.9" stroke-opacity="0.5" />
  </g>

  <!-- Delicate Petal Midribs -->
  <path d="M120 114 L120 34" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="2 2" />
  <path d="M118 114 C98 90, 82 68, 70 50" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.35" />
  <path d="M122 114 C142 90, 158 68, 170 50" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.35" />

  <!-- Champagne Gold Stamens & Anthers -->
  <path d="M120 116 C114 94, 106 78, 98 68" stroke="#C5A059" stroke-width="1.3" stroke-linecap="round" />
  <path d="M120 116 C119 92, 117 72, 115 58" stroke="#C5A059" stroke-width="1.3" stroke-linecap="round" />
  <path d="M120 116 C122 92, 125 72, 127 58" stroke="#C5A059" stroke-width="1.3" stroke-linecap="round" />
  <path d="M120 116 C126 94, 134 78, 142 68" stroke="#C5A059" stroke-width="1.3" stroke-linecap="round" />

  <ellipse cx="97" cy="67" rx="3.2" ry="1.8" transform="rotate(-30 97 67)" fill="#D4AF37" />
  <ellipse cx="115" cy="56" rx="3.2" ry="1.8" transform="rotate(-10 115 56)" fill="#5C1D24" opacity="0.75" />
  <ellipse cx="127" cy="56" rx="3.2" ry="1.8" transform="rotate(15 127 56)" fill="#D4AF37" />
  <ellipse cx="143" cy="67" rx="3.2" ry="1.8" transform="rotate(30 143 67)" fill="#5C1D24" opacity="0.75" />
</svg>

